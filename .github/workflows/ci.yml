name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate skill manifests and plugin.json
        run: npm run validate

      - name: Build official product website
        run: npm run build:site

      - name: Run automated test suites
        run: npm test

      - name: Run plugin packager validation
        run: npm run pack

      - name: Run benchmark cases validation
        run: npm run benchmark:validate

      - name: Run deterministic benchmark suite
        run: npm run benchmark

      - name: Run system doctor check (warning allowed due to optional playwright)
        run: |
          node bin/ves-doctor.js || if [ $? -le 1 ]; then exit 0; else exit 1; fi
        shell: bash

