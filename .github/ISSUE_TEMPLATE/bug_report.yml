name: Bug Report
description: Report a bug, validation error, or unexpected behavior in Visual Engineering Suite
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem! Please make sure you have run `node bin/ves-doctor.js` before submitting this issue.
  - type: input
    id: agent_platform
    attributes:
      label: Target Agent Platform
      description: Which AI coding agent platform did you encounter this on?
      placeholder: "e.g. Google Antigravity, Claude Code, Cursor, Skills CLI"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Runtime Details
      description: Node.js version, OS, and hardware architecture.
      placeholder: "e.g. Node v20.11.0, Windows 11 x64, macOS Sonoma ARM64"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear, minimal steps to reproduce the issue.
      placeholder: |
        1. Run `node bin/ves-diff.js ...`
        2. With arguments ...
        3. Observed error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Doctor Output / Terminal Logs
      description: Paste output from `node bin/ves-doctor.js` or CLI command.
      render: shell
