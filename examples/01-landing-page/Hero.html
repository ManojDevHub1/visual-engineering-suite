<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Hero - Visual Engineering Suite</title>
  <style>
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --accent: #38BDF8;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .logo {
      width: 64px;
      height: 24px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #0F172A;
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    nav {
      display: flex;
      gap: 20px;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s;
    }
    nav a:hover, nav a:focus-visible {
      color: var(--text-main);
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }
    main {
      flex: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 32px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
    }
    @media (min-width: 768px) {
      main {
        grid-template-columns: 1.2fr 0.8fr;
        padding: 64px 32px;
      }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    p.subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      height: 48px;
      min-width: 140px;
      padding: 0 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.05s;
    }
    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface);
    }
    .btn-secondary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      min-height: 284px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">VES</div>
    <nav aria-label="Main Navigation">
      <a href="#features">Features</a>
      <a href="#docs">Documentation</a>
      <a href="#github">GitHub</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="badge">v1.0 Release Available</div>
      <h1>Universal Visual Engineering for AI Agents</h1>
      <p class="subtitle">
        Empower AI coding assistants with systematic visual reconstruction, design token extraction, and pixel-level visual regression triage.
      </p>
      <div class="btn-group">
        <a href="#get-started" class="btn btn-primary">Get Started</a>
        <a href="#demo" class="btn btn-secondary">Live Demo</a>
      </div>
    </section>

    <aside class="hero-card" aria-label="Product Preview Card">
      <div style="width: 100%; height: 160px; background: rgba(56, 189, 248, 0.1); border: 1px dashed var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600;">
        Interactive Visual QA Canvas
      </div>
    </aside>
  </main>
</body>
</html>
